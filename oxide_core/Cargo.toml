[package]
name = "oxide_core"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "oxide_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.29.0"
csv = "1"
serde = { version = "1", features = ["derive"] }
chrono = "0.4"
chrono-tz = "0.10"