[package]
name = "oxide_engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
description = "Vectorized-signal backtesting engine: Python strategies, Rust execution."
license = "MIT"
readme = "README.md"
publish = false

[lib]
name = "oxide_engine"
# cdylib -> the Python extension module; rlib -> lets `cargo test` link the crate.
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Turned on by maturin (see pyproject.toml). Keep it OFF for `cargo test` so the
# test binary links against libpython instead of expecting a host interpreter.
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py39"] }
thiserror = "2"
csv = "1.4"

[profile.release]
lto = "thin"
codegen-units = 1
